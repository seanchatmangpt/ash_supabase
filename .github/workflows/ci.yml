name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
            lint: true
          - elixir: "1.17.3"
            otp: "27.3"
          - elixir: "1.16.3"
            otp: "26.2"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Check for unused dependencies
        if: matrix.lint
        run: mix deps.unlock --check-unused

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Credo
        if: matrix.lint
        run: mix credo --strict

      - name: Audit dependencies for known vulnerabilities
        if: matrix.lint
        run: mix deps.audit

      - run: mix test

  without-optional-deps:
    name: Compiles without optional dependencies
    runs-on: ubuntu-latest

    # `:plug`, `:ash_postgres`, `:igniter` and `:mint_web_socket` are optional.
    # A struct pattern or a bare module reference outside a `Code.ensure_loaded?`
    # guard breaks every downstream app that does not have them, and nothing in
    # the normal test run would notice, because they are all installed there.
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"

      - name: Build a consumer project that depends only on ash_supabase
        run: |
          mkdir -p /tmp/consumer/lib
          cd /tmp/consumer
          cat > mix.exs <<'EOF'
          defmodule Consumer.MixProject do
            use Mix.Project
            def project, do: [app: :consumer, version: "0.1.0", elixir: "~> 1.15", deps: deps()]
            def application, do: [extra_applications: [:logger]]
            defp deps, do: [{:ash_supabase, path: "${{ github.workspace }}"}]
          end
          EOF
          echo 'defmodule Consumer do end' > lib/consumer.ex
          mix deps.get
          mix compile --warnings-as-errors

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      - run: mix deps.get
      - run: mkdir -p priv/plts
      - run: mix dialyzer --format github
